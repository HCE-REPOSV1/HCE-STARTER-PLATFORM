services:
  jarvis-server:
    build:
      context: ./jarvis-server
    restart: unless-stopped
    ports:
      - "10200:10200"
    environment:
      NODE_ENV: production
      ALLOWED_ORIGINS: "http://localhost:10201,http://localhost:5173"
    volumes:
      - ./jarvis-server/config:/app/config
    networks:
      - jarvis-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:10200/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  jarvis-ui:
    build:
      context: ./jarvis-ui
      args:
        VERDACCIO_URL: http://host.docker.internal:10100
      extra_hosts:
        - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - "10201:80"
    depends_on:
      jarvis-server:
        condition: service_healthy
    networks:
      - jarvis-net

networks:
  jarvis-net:
    driver: bridge
